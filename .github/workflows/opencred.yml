name: OpenCred Assessment
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  opencred:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shreyanshagrawal/justabyte@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}